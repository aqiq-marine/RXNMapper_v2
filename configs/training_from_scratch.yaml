# Basic Params:
dataset_name: "USPTO" # only for naming
checkpoint_path: "/absolute/path/to/checkpoint/folder" # can be left empty is `resume_from_checkpoint: False`
dataset_path: "/absolute/path/to/csv/of/dataset" # path to the preprocessed dataset (out from `preprocess_by_token_len`)
delimiter: "\t" #"," for csv, "\t" for tsv,..
resume_from_checkpoint: false 

# Preprocessing argument (i.e. does the dataset need to be tokenised and filtered for sequence length)
preprocess_dataset: false
save_processed_data_path: "" # not implemented yet in training

# Vocab arguments (i.e. do we want to build a new vocab based on the new data + merge it with the USPTO vocab):
default_vocab_path: "rxnmapper/models/transformers/albert_heads_8_uspto_all_1310k/vocab.txt" #is hardcoded in train_mlm_alberta_stream.py for now
vocab_path: "/path/to/new/vocab" # if custom vocab other than default, empty otherwise
auto_vocab: false
save_vocab_path: "" # not implemented yet
merge_new_with_default: false # not implemented yet. auto-vocab automatically merges new vocab with default vocab
vocab_output_path: ""

# Model arguments:
alberta_config: {
    "architectures": [
      "AlbertForMaskedLM"
    ],
    "attention_probs_dropout_prob": 0.1,
    "bos_token_id": 0,
    "classifier_dropout_prob": 0.1,
    "do_sample": false,
    "down_scale_factor": 1,
    "embedding_size": 128,
    "eos_token_ids": 0,
    "finetuning_task": null,
    "gap_size": 0,
    "hidden_act": "gelu",
    "hidden_dropout_prob": 0.1,
    "hidden_size": 256,
    "id2label": {
      "0": "LABEL_0",
      "1": "LABEL_1"
    },
    "initializer_range": 0.02,
    "inner_group_num": 1,
    "intermediate_size": 512,
    "is_decoder": false,
    "label2id": {
      "LABEL_0": 0,
      "LABEL_1": 1
    },
    "layer_norm_eps": 0.000000000001,
    "length_penalty": 1.0,
    "max_length": 20,
    "max_position_embeddings": 512,
    "model_type": "albert",
    "net_structure_type": 0,
    "num_attention_heads": 8,
    "num_beams": 1,
    "num_hidden_groups": 1,
    "num_hidden_layers": 12,
    "num_labels": 2,
    "num_memory_blocks": 0,
    "num_return_sequences": 1,
    "output_attentions": false,
    "output_hidden_states": false,
    "output_past": true,
    "pad_token_id": 0,
    "pruned_heads": {},
    "repetition_penalty": 1.0,
    "temperature": 1.0,
    "top_k": 50,
    "top_p": 1.0,
    "torchscript": false,
    "type_vocab_size": 2,
    "use_bfloat16": false,
    "vocab_size": 591 #adapt based on your vocab
  }


# Atom mapping parameters: 
model_path: "" # Choose the checkpoint to use for Generation
model_type: "albert"
attention_multiplier: 90.0
head: 3       # The correct head will have to be found. 
layers: [10]  # Correct Layer will also have to be found. 


# Masked language modelling parameters:
mlm_probability: 0.15

# Training parameters:
output_dir: "trained_models/model_name"
logging_dir: "logs/model_name"
run_name: "model_name"

learning_rate: 0.0001
weight_decay: 0.0001
batch_size: 32
accum_steps: 4

max_steps: 2_000_000
warmup_steps: 10_000

save_strategy: "steps"
save_step: 10_000
save_total_limit: 200

logging_steps: 500
logging_first_step: True
report_to:
  - tensorboard # [], ["wandb"]

eval_strategy: "no"
save_only_model: True



