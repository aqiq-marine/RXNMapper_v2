# Config paths:
alberta_config_path: "configs/alberta_basic_config.json"
dataset_name: "USPTO"
checkpoint_path: ""


# Atom mapping parameters: 
model_path: ""
model_type: "albert"
attention_multiplier: 90.0
head: 5
layers: [10]


# Masked language modelling parameters:
mlm_probability: 0.15

# Training parameters:
output_dir: "trained_models/alberta_baseline"
logging_dir: "logs/alberta_baseline"
report_to: ["none"]  # ["wandb"]
run_name: "alberta_baseline"


learning_rate: 0.0001
weight_decay: 0.0001
batch_size: 32
accum_steps: 4

max_steps: 1_500_000
warmup_steps: 10_000
logging_steps: 500
save_step: 1_000


eval_strategy: "no"
save_strategy: "steps"
logging_first_step: True
save_total_limit: 10
save_only_model: True




