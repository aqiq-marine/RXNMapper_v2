# Basic Params:
dataset_name: "USPTO"
checkpoint_path: ""

# Model arguments:
alberta_config: {
    "architectures": [
      "AlbertForMaskedLM"
    ],
    "attention_probs_dropout_prob": 0.1,
    "bos_token_id": 0,
    "classifier_dropout_prob": 0.1,
    "do_sample": false,
    "down_scale_factor": 1,
    "embedding_size": 128,
    "eos_token_ids": 0,
    "finetuning_task": null,
    "gap_size": 0,
    "hidden_act": "gelu",
    "hidden_dropout_prob": 0.1,
    "hidden_size": 256,
    "id2label": {
      "0": "LABEL_0",
      "1": "LABEL_1"
    },
    "initializer_range": 0.02,
    "inner_group_num": 1,
    "intermediate_size": 512,
    "is_decoder": false,
    "label2id": {
      "LABEL_0": 0,
      "LABEL_1": 1
    },
    "layer_norm_eps": 0.000000000001,
    "length_penalty": 1.0,
    "max_length": 20,
    "max_position_embeddings": 512,
    "model_type": "albert",
    "net_structure_type": 0,
    "num_attention_heads": 8,
    "num_beams": 1,
    "num_hidden_groups": 1,
    "num_hidden_layers": 12,
    "num_labels": 2,
    "num_memory_blocks": 0,
    "num_return_sequences": 1,
    "output_attentions": false,
    "output_hidden_states": false,
    "output_past": true,
    "pad_token_id": 0,
    "pruned_heads": {},
    "repetition_penalty": 1.0,
    "temperature": 1.0,
    "top_k": 50,
    "top_p": 1.0,
    "torchscript": false,
    "type_vocab_size": 2,
    "use_bfloat16": false,
    "vocab_size": 591
  }


# Atom mapping parameters: 
model_path: ""
model_type: "albert"
attention_multiplier: 90.0
head: 5
layers: [10]


# Masked language modelling parameters:
mlm_probability: 0.15

# Training parameters:
output_dir: "trained_models/alberta_baseline"
logging_dir: "logs/alberta_baseline"
report_to: ["none"]  # ["wandb"]
run_name: "alberta_baseline"


learning_rate: 0.0001
weight_decay: 0.0001
batch_size: 32
accum_steps: 4

max_steps: 1_500_000
warmup_steps: 10_000
logging_steps: 500
save_step: 1_000


eval_strategy: "no"
save_strategy: "steps"
logging_first_step: True
save_total_limit: 10
save_only_model: True




